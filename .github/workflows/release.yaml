name: Build and Push Container Image

on:
  release:
    types: [published]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and Push Container Image
    runs-on: hetzner-incus
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: stafftastic/github-actions/nix-auth@v1.6.0
        with:
          private-key: ${{secrets.NIX_REPOSITORY_ACCESS_PRIVATE_KEY}}
      - uses: Mic92/niks3-action@v1.1.0
        with:
          server-url: https://nix-cache.stafftastic.dev
      - uses: docker/login-action@v4.6.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: _json_key
          password: ${{secrets.GOOGLE_ARTIFACT_REGISTRY_SA_KEY}}

      - run: nix build .#dockerImage
      - id: load
        run: |
          echo image="$(
            docker load -qi result \
            | sed 's/^Loaded image: \(.*\)$/\1/'
          )" >> "$GITHUB_OUTPUT"
      - run: |
          registry_image="europe-west3-docker.pkg.dev/stafftastic/images/commit-status-poster"
          docker image tag ${{steps.load.outputs.image}} $registry_image:latest
          docker image tag ${{steps.load.outputs.image}} $registry_image:${{github.ref_name}}
          docker push --all-tags $registry_image
