name: Build and Push Container Image

on:
  release:
    types: [published]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and Push Container Image
    runs-on: hetzner-incus
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: stafftastic/github-actions/nix-auth@v1.9.0
        with:
          private-key: ${{secrets.NIX_REPOSITORY_ACCESS_PRIVATE_KEY}}
      - uses: Mic92/niks3-action@v1.1.0
        with:
          server-url: https://nix-cache.stafftastic.dev
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: europe-west3-docker.pkg.dev/stafftastic/images/commit-status-poster
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - run: nix build .#dockerImage
      - id: load
        run: |
          echo image="$(
            docker load -qi result \
            | sed 's/^Loaded image: \(.*\)$/\1/'
          )" >> "$GITHUB_OUTPUT"
      - name: Authenticate with Google Cloud
        id: auth
        uses: stafftastic/github-actions/gcp-auth@v1.9.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{steps.auth.outputs.token}}
      - run: |
          registry_image="europe-west3-docker.pkg.dev/stafftastic/images/commit-status-poster"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker image tag ${{steps.load.outputs.image}} "$tag" </dev/null
          done <<< "${{steps.meta.outputs.tags}}"
          docker push --all-tags $registry_image
